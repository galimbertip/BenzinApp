const { useState, useEffect, useRef, useMemo } = React;

// ─── Costanti ─────────────────────────────────────────────────────────────────
const FUEL_TYPES  = ["Benzina","Diesel","GPL","Metano","Elettrico","Ibrido"];
const MONTHS_IT   = ["Gen","Feb","Mar","Apr","Mag","Giu","Lug","Ago","Set","Ott","Nov","Dic"];
const GDRIVE_CLIENT_ID = "186081684364-o5vsskphmdp9t9j3eenbo6sns6m6j56c.apps.googleusercontent.com";

// ─── Helpers ──────────────────────────────────────────────────────────────────
const fmtDate = d => d ? new Date(d).toLocaleDateString("it-IT") : "";
const fmtTime = d => d ? new Date(d).toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"}) : "";
const nowISO  = () => new Date().toISOString();

function parseNum(raw) {
  if (!raw || !raw.trim()) return null;
  let s = raw.trim().replace(/[€$£\s]/g,"");
  if (/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g,"").replace(",",".");
  else if (/^\d+(,\d+)$/.test(s)) s = s.replace(",",".");
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}

function detectSep(line) {
  const t=(line.match(/\t/g)||[]).length, sc=(line.match(/;/g)||[]).length, cc=(line.match(/,/g)||[]).length;
  if(t>=sc&&t>=cc) return "\t";
  return sc>cc ? ";" : ",";
}

function splitLine(line, sep) {
  const res=[]; let cur="", inQ=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(c==='"'){inQ=!inQ;continue;}
    if(c===sep&&!inQ){res.push(cur.trim());cur="";continue;}
    cur+=c;
  }
  res.push(cur.trim());
  return res;
}

function parseCSV(text) {
  text = text.replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  const lines = text.trim().split("\n").filter(l=>l.trim());
  if(lines.length<2) return {rows:[],warnings:[{line:1,warnings:["File vuoto o con una sola riga"]}],sepName:"–"};
  const sep = detectSep(lines[0]);
  const sepName = sep==="\t"?"tab (Excel)":sep===";"?"punto e virgola (;)":"virgola (,)";
  const header = splitLine(lines[0],sep).map(h=>h.toLowerCase().replace(/['"]/g,"").trim());
  const rows=[], warnings=[];

  for(let i=1;i<lines.length;i++){
    if(!lines[i].trim()) continue;
    const cols = splitLine(lines[i],sep);
    const o={}; header.forEach((h,idx)=>o[h]=(cols[idx]||"").trim());
    const warn=[];

    const dateStr = o["data"]||o["date"]||"";
    const timeStr = o["ora"]||o["time"]||"";
    let dt=null;
    if(dateStr){
      try{
        let d,m,y;
        if(/\d{4}-\d{2}-\d{2}/.test(dateStr)){[y,m,d]=dateStr.split("-");}
        else{[d,m,y]=dateStr.split(/[\/\-]/);}
        const tp=timeStr?timeStr.slice(0,5):"00:00";
        const c=new Date(`${y}-${m.padStart(2,"0")}-${d.padStart(2,"0")}T${tp}:00`);
        if(isNaN(c)) throw 0;
        dt=c.toISOString();
      }catch{warn.push(`⚠️ data non riconosciuta: "${dateStr}"`);}
    }

    const kmRaw    = o["km attuali"]||o["km"]||"";
    const amtRaw   = o["importo"]||"";
    const priceRaw = o["prezzo €/litro"]||o["prezzo €/l"]||o["prezzo/litro"]||o["prezzo"]||"";
    const deltaRaw = o["km distanza percorsa"]||o["kmdistanza percorsa"]||o["distanza"]||"";

    const km    = parseNum(kmRaw);
    const amount= parseNum(amtRaw);
    const price = parseNum(priceRaw);
    const kmDelta=parseNum(deltaRaw);

    if(kmRaw&&km===null)    warn.push(`⚠️ km non validi: "${kmRaw}"`);
    if(amtRaw&&amount===null) warn.push(`⚠️ importo non valido: "${amtRaw}"`);
    if(priceRaw&&price===null) warn.push(`⚠️ prezzo non valido: "${priceRaw}"`);

    const vRaw = o["auto"]||o["veicolo"]||"";
    const id   = btoa([dateStr,kmRaw,amtRaw,priceRaw,i].join("|")).replace(/[^a-zA-Z0-9]/g,"").slice(0,28);

    rows.push({id,datetime:dt,fuelType:o["carburante"]||o["fuel"]||"Benzina",km,kmDelta,amount,pricePerLiter:price,vehicle:vRaw,_vRaw:vRaw});
    if(warn.length) warnings.push({line:i+1,warnings:warn});
  }

  for(let i=1;i<rows.length;i++){
    if(!rows[i].kmDelta&&rows[i].km&&rows[i-1].km){
      const d=rows[i].km-rows[i-1].km;
      if(d>0) rows[i].kmDelta=d;
    }
  }
  return {rows,warnings,sepName};
}

// Garage: array di veicoli in settings/garage.vehicles + activeVehicleId
function useGarage(fs){
  const [garage,setGarage]=useState([]);
  const [activeId,setActiveId]=useState(null);
  useEffect(()=>{
    if(!fs) return;
    const {db,doc,collection,onSnapshot}=fs;
    return onSnapshot(doc(collection(db,"settings"),"garage"),snap=>{
      const d=snap.data();
      if(d){
        setGarage(d.vehicles||[]);
        setActiveId(d.activeId||null);
      }
    });
  },[fs]);

  const saveGarage=async(vehicles,aId)=>{
    const {db,doc,setDoc,collection}=fs;
    await setDoc(doc(collection(db,"settings"),"garage"),{vehicles,activeId:aId});
  };

  const addVehicle=async v=>{
    const newV={...v,id:crypto.randomUUID()};
    const newGarage=[...garage,newV];
    const newActiveId=garage.length===0?newV.id:activeId;
    await saveGarage(newGarage,newActiveId);
    return newV;
  };

  const removeVehicle=async id=>{
    const newGarage=garage.filter(v=>v.id!==id);
    const newActiveId=activeId===id?(newGarage.length?newGarage[0].id:null):activeId;
    await saveGarage(newGarage,newActiveId);
  };

  const setActive=async id=>{
    await saveGarage(garage,id);
  };

  return {garage,activeId,addVehicle,removeVehicle,setActive};
}

function BarChart({data,color="var(--amber)",fmt=v=>v,lk="label",vk="value"}){

        </div>
      ))}
    </div>
  );
}

function LineChart({data,color="#22d3ee",lk="label",vk="value"}){
  const vals=data.map(d=>d[vk]||0);
  const max=Math.max(...vals,1),min=Math.min(...vals.filter(v=>v>0),max),range=max-min||1;
  const H=80,W=100;
  const pts=data.map((d,i)=>{
    const x=data.length<2?W/2:(i/(data.length-1))*W;
    const y=d[vk]>0?H-((d[vk]-min)/range)*(H-10):H;
    return `${x},${y}`;
  }).join(" ");
  return(
    <div>
      <svg viewBox={`0 0 100 ${H}`} style={{width:"100%",height:90}} preserveAspectRatio="none">
        <polyline points={pts} fill="none" stroke={color} strokeWidth="2" strokeLinejoin="round"/>
        {data.map((d,i)=>{
          const x=data.length<2?W/2:(i/(data.length-1))*W;
          const y=d[vk]>0?H-((d[vk]-min)/range)*(H-10):H;
          return d[vk]>0?<circle key={i} cx={x} cy={y} r="2.5" fill={color}/>:null;
        })}
      </svg>
      <div style={{display:"flex",justifyContent:"space-between",marginTop:4}}>
        {data.map((d,i)=><div key={i} style={{fontSize:9,color:"var(--text-faint)",textAlign:"center",flex:1}}>{d[lk]}</div>)}
      </div>
    </div>
  );
}

function AddRefuelModal({vehicle,lastKm,onSave,onClose}){

      <div style={{marginBottom:12}}>

      v={brand:manBrand,model:manModel,year:manYear,fuel,targa:targa.toUpperCase()};

      v={brand:selMake.make_display,model:selModel.model_name,year:selTrim?selTrim.model_year:"",fuel,targa:targa.toUpperCase()};
    }
    setSaving(true);
    await onSave(v);
    setSaving(false);
  };

  const fMakes=makes.filter(m=>m.make_display.toLowerCase().includes(search.toLowerCase()));

        ))}

      {mode==="manual"?(<>

        <div style={{fontSize:12,color:"var(--text-dim)",marginBottom:4}}>Anno</div>

        <div style={{fontSize:12,color:"var(--text-dim)",marginBottom:4}}>⛽ Carburante *</div>

        <button onClick={confirm} disabled={saving} style={{width:"100%",background:saving?"var(--border)":"var(--grad)",color:"#fff",border:"none",borderRadius:12,padding:14,cursor:saving?"not-allowed":"pointer",fontSize:15,fontWeight:700}}>
          {saving?"⏳ Salvataggio...":"✅ Aggiungi al Garage"}
        </button>
      </>):(<>
        <div style={{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap"}}>
          {[{s:"make",l:selMake?selMake.make_display:"Marca"},selMake&&{s:"model",l:selModel?selModel.model_name:"Modello"},selModel&&{s:"trim",l:"Versione"},selModel&&{s:"confirm",l:"✅ Conferma"}].filter(Boolean).map((b,i)=>(

// ─── ImportModal ──────────────────────────────────────────────────────────────
function ImportModal({onImport,onClose,activeVehicle,notify}){
  const [stage,setStage]=useState("upload");
  const [parsed,setParsed]=useState(null);
  const [vRes,setVRes]=useState({});
  const [importing,setImporting]=useState(false);
  const [driveLoading,setDriveLoading]=useState(false);
  const fileRef=useRef();

  const handleParsed=text=>{setParsed(parseCSV(text));setStage("preview");};
  const handleFile=e=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader(); r.onload=ev=>handleParsed(ev.target.result); r.readAsText(f,"UTF-8");
  };

  const openDrive=()=>{
    if(!window.google?.accounts?.oauth2){notify("❌ Google API non caricata","error");return;}
    setDriveLoading(true);
    const client = window.google.accounts.oauth2.initTokenClient({
      client_id: GDRIVE_CLIENT_ID, scope: GDRIVE_SCOPE,
      callback: async tokenResp => {
        if(tokenResp.error){notify("❌ Accesso Drive negato","error");setDriveLoading(false);return;}
        const token = tokenResp.access_token;
        window.gapi.load("picker",()=>{
          setDriveLoading(false);
          new window.google.picker.PickerBuilder()
            .addView(new window.google.picker.DocsView().setMimeTypes("text/csv,text/plain,application/vnd.google-apps.spreadsheet"))
            .setOAuthToken(token)
            .setCallback(async data=>{
              if(data.action!==window.google.picker.Action.PICKED) return;
              const file=data.docs[0];
              try{
                const url=file.mimeType==="application/vnd.google-apps.spreadsheet"
                  ?`https://www.googleapis.com/drive/v3/files/${file.id}/export?mimeType=text/csv`
                  :`https://www.googleapis.com/drive/v3/files/${file.id}?alt=media`;
                const res=await fetch(url,{headers:{Authorization:`Bearer ${token}`}});
                handleParsed(await res.text());
              }catch(e){notify("❌ Errore lettura Drive: "+e.message,"error");}
            }).build().setVisible(true);
        });
      },
    });
    client.requestAccessToken();
  };

  const doImport=async()=>{
    setImporting(true);
    await onImport(parsed.rows.map(r=>({...r,vehicle:vRes[r._vRaw]??r._vRaw})));
    setImporting(false);
  };

  const uniqueVehicles=[...new Set((parsed?.rows||[]).map(r=>r._vRaw).filter(Boolean))];

  return(
    <Modal title="📥 Importa CSV" onClose={onClose}>
      {stage==="upload"&&<>
        <div style={{background:"var(--surface-2)",borderRadius:12,padding:14,marginBottom:16}}>
          <div style={{fontWeight:700,fontSize:13,marginBottom:10,color:"var(--amber)"}}>📋 Struttura CSV attesa</div>
          {[
            ["Separatore","virgola (,) o punto e virgola (;) o tab — rilevato automaticamente"],
            ["Formato data","GG/MM/AAAA (es. 15/03/2023)"],
            ["Formato ora","HH:MM (es. 08:30) — opzionale"],
            ["Decimali","punto (1.879) o virgola (1,879) — entrambi accettati"],
          ].map(([k,v],i)=><div key={i} style={{fontSize:12,marginBottom:5}}><span style={{color:"#e2e8f0",fontWeight:600}}>{k}:</span> <span style={{color:"var(--text-dim)"}}>{v}</span></div>)}
          <div style={{fontSize:11,color:"var(--text-faint)",marginTop:8,marginBottom:4}}>Intestazione:</div>
          <div style={{background:"var(--surface)",borderRadius:8,padding:8,fontFamily:"monospace",fontSize:10,color:"#22d3ee",overflowX:"auto",whiteSpace:"nowrap"}}>data,ora,km attuali,km distanza percorsa,importo,prezzo €/litro,carburante,auto</div>
        </div>
        <input type="file" accept=".csv,.txt" onChange={handleFile} ref={fileRef} style={{display:"none"}}/>
        <button onClick={()=>fileRef.current.click()} style={{width:"100%",background:"var(--grad)",color:"#fff",border:"none",borderRadius:12,padding:14,cursor:"pointer",fontSize:15,fontWeight:700,marginBottom:10}}>
          📂 Scegli file dal dispositivo
        </button>
        <button onClick={openDrive} disabled={driveLoading} style={{width:"100%",background:driveLoading?"var(--border)":"linear-gradient(135deg,#16a34a,#15803d)",color:"#fff",border:"none",borderRadius:12,padding:14,cursor:driveLoading?"not-allowed":"pointer",fontSize:15,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
          <svg width="18" height="18" viewBox="0 0 87.3 78"><path d="M6.6 66.85l3.85 6.65c.8 1.4 1.95 2.5 3.3 3.3l13.75-23.8H0c0 1.55.4 3.1 1.2 4.5z" fill="#0066DA"/><path d="M43.65 25L29.9 1.2C28.55 2 27.4 3.1 26.6 4.5L1.2 49.05c-.8 1.4-1.2 2.95-1.2 4.5h27.5z" fill="#00AC47"/><path d="M73.55 76.8c1.35-.8 2.5-1.9 3.3-3.3l1.6-2.75 7.65-13.25c.8-1.4 1.2-2.95 1.2-4.5H59.8l5.85 11.5z" fill="#EA4335"/><path d="M43.65 25L57.4 1.2C56.05.4 54.5 0 52.9 0H34.4c-1.6 0-3.15.45-4.5 1.2z" fill="#00832D"/><path d="M59.8 53.55H27.5L13.75 77.35c1.35.8 2.9 1.2 4.5 1.2h50.8c1.6 0 3.15-.4 4.5-1.2z" fill="#2684FC"/><path d="M73.4 26.45l-12.65-21.9C59.95 3.1 58.8 2 57.45 1.2L43.7 25l16.15 28h27.45c0-1.55-.4-3.1-1.2-4.5z" fill="#FFBA00"/></svg>
          {driveLoading?"⏳ Apertura Drive...":"Importa da Google Drive"}
        </button>
      </>}

      {stage==="preview"&&parsed&&<>
        <div style={{background:"var(--surface-2)",borderRadius:10,padding:8,marginBottom:12,fontSize:12,color:"var(--text-faint)"}}>
          Separatore rilevato: <code style={{color:"var(--amber)"}}>{parsed.sepName}</code>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
          <div style={{background:"#14532d",borderRadius:10,padding:12,textAlign:"center"}}>
            <div style={{fontSize:22,fontWeight:700,color:"#4ade80"}}>{parsed.rows.length}</div>
            <div style={{fontSize:12,color:"#86efac"}}>✅ Righe importabili</div>
          </div>
          <div style={{background:parsed.warnings.length?"#422006":"var(--surface)",borderRadius:10,padding:12,textAlign:"center"}}>
            <div style={{fontSize:22,fontWeight:700,color:parsed.warnings.length?"#fb923c":"var(--text-faint)"}}>{parsed.warnings.length}</div>
            <div style={{fontSize:12,color:parsed.warnings.length?"#fed7aa":"var(--text-faint)"}}>⚠️ Con avvisi</div>
          </div>
        </div>

        {parsed.warnings.length>0&&<>
          <div style={{fontWeight:700,fontSize:13,marginBottom:8,color:"#fb923c"}}>⚠️ Avvisi</div>
          <div style={{maxHeight:150,overflowY:"auto",marginBottom:12}}>
            {parsed.warnings.map((e,i)=>(
              <div key={i} style={{background:"#1c1008",borderRadius:8,padding:10,marginBottom:6,fontSize:12}}>
                <div style={{color:"#fb923c",fontWeight:700}}>Riga {e.line}</div>
                {e.warnings.map((w,j)=><div key={j} style={{color:"#fed7aa",marginTop:2}}>{w}</div>)}
              </div>
            ))}
          </div>
        </>}

        {uniqueVehicles.length>0&&<>
          <div style={{fontWeight:700,fontSize:13,marginBottom:8,color:"var(--amber)"}}>🚗 Verifica nomi veicoli</div>
          {uniqueVehicles.map(raw=>(
            <div key={raw} style={{background:"var(--surface-2)",borderRadius:8,padding:10,marginBottom:8}}>
              <div style={{fontSize:12,color:"var(--text-dim)",marginBottom:6}}>CSV: <strong style={{color:"#e2e8f0"}}>"{raw}"</strong></div>
              <input value={vRes[raw]??raw} onChange={e=>setVRes(p=>({...p,[raw]:e.target.value}))} style={INP_SM}/>
              {activeVehicle&&<button onClick={()=>setVRes(p=>({...p,[raw]:`${activeVehicle.brand} ${activeVehicle.model}`}))}
                style={{marginTop:6,background:"var(--border)",color:"#e2e8f0",border:"none",borderRadius:6,padding:"4px 10px",cursor:"pointer",fontSize:11}}>
                Usa veicolo attivo: {activeVehicle.brand} {activeVehicle.model}
              </button>}
            </div>
          ))}
        </>}

        <div style={{display:"flex",gap:8,marginTop:8}}>
          <button onClick={()=>setStage("upload")} style={{flex:1,background:"var(--border)",color:"#e2e8f0",border:"none",borderRadius:10,padding:12,cursor:"pointer",fontSize:13}}>← Indietro</button>
          <button onClick={doImport} disabled={importing||!parsed.rows.length}
            style={{flex:2,background:!parsed.rows.length?"var(--border)":"var(--grad)",color:"#fff",border:"none",borderRadius:10,padding:12,cursor:!parsed.rows.length?"not-allowed":"pointer",fontSize:14,fontWeight:700}}>
            {importing?"⏳ Importazione...":`✅ Importa ${parsed.rows.length} righe`}
          </button>
        </div>
      </>}
    </Modal>
  );
}

// ─── ExportModal ──────────────────────────────────────────────────────────────
function ExportModal({refuels,onClose}){
  const doExport=fmt=>{
    const isIT=fmt==="excel_it";
    const sep=isIT?";":",";
    const n=v=>(v===null||v===undefined)?"":v;
    const dec=v=>isIT?n(v).toString().replace(".",","):n(v);
    const header=["data","ora","km attuali","km distanza percorsa","importo","prezzo €/litro","carburante","auto"].join(sep);
    const rows=refuels.map(r=>[fmtDate(r.datetime),fmtTime(r.datetime),dec(r.km),dec(r.kmDelta),dec(r.amount),dec(r.pricePerLiter),r.fuelType||"",`"${r.vehicle||""}"`].join(sep));
    const bom=isIT?"\uFEFF":"";
    const blob=new Blob([bom+[header,...rows].join("\n")],{type:"text/csv;charset=utf-8;"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`rifornimenti_${fmt}.csv`; a.click();
    onClose();
  };
  return(
    <Modal title="📤 Esporta CSV" onClose={onClose}>
      <div style={{fontSize:13,color:"var(--text-dim)",marginBottom:16}}>Scegli il formato:</div>
      {[
        {id:"standard",icon:"🌐",label:"Standard / Re-import app",desc:"Virgola (,) · Punto decimale (.) · Universale"},
        {id:"excel_it",icon:"📗",label:"Excel italiano",desc:"Punto e virgola (;) · Virgola decimale (,) · BOM UTF-8"},
        {id:"gfogli",  icon:"📊",label:"Google Fogli",desc:"Virgola (,) · Punto decimale (.) · Ottimale per Sheets"},
      ].map(f=>(
        <button key={f.id} onClick={()=>doExport(f.id)} style={{width:"100%",background:"var(--surface-2)",border:"1px solid var(--border)",borderRadius:12,padding:14,cursor:"pointer",marginBottom:10,textAlign:"left",color:"#e2e8f0"}}>
          <div style={{fontSize:15,fontWeight:700,marginBottom:4}}>{f.icon} {f.label}</div>
          <div style={{fontSize:12,color:"var(--text-faint)"}}>{f.desc}</div>
        </button>
      ))}
    </Modal>
  );
}

// ─── StatsTab ─────────────────────────────────────────────────────────────────
function StatsTab({refuels}){
  const [view,setView]=useState("km_year"); const [selY,setSelY]=useState(null);
  const years=useMemo(()=>[...new Set(refuels.map(r=>new Date(r.datetime||Date.now()).getFullYear()))].sort(),[refuels]);
  const yr=selY||(years.length?years[years.length-1]:new Date().getFullYear());
  const byYr=r=>new Date(r.datetime||Date.now()).getFullYear()===yr;

  const kmByYear=useMemo(()=>{const m={};refuels.forEach(r=>{const y=new Date(r.datetime||Date.now()).getFullYear();if(!m[y])m[y]={min:Infinity,max:-Infinity};if(r.km){m[y].min=Math.min(m[y].min,r.km);m[y].max=Math.max(m[y].max,r.km);}});return Object.entries(m).map(([y,v])=>({label:y,value:v.max===-Infinity?0:v.max-(v.min===Infinity?0:v.min)})).sort((a,b)=>a.label-b.label);},[refuels]);
  const kmByMonth=useMemo(()=>{const m={};refuels.filter(byYr).forEach(r=>{if(r.kmDelta){const mo=new Date(r.datetime).getMonth();m[mo]=(m[mo]||0)+r.kmDelta;}});return MONTHS_IT.map((l,i)=>({label:l,value:m[i]||0}));},[refuels,yr]);
  const priceMonth=useMemo(()=>{const m={};refuels.filter(byYr).forEach(r=>{if(r.pricePerLiter){const mo=new Date(r.datetime).getMonth();(m[mo]=m[mo]||[]).push(r.pricePerLiter);}});return MONTHS_IT.map((l,i)=>({label:l,value:m[i]?m[i].reduce((s,v)=>s+v,0)/m[i].length:0}));},[refuels,yr]);
  const priceYear=useMemo(()=>{const m={};refuels.forEach(r=>{if(r.pricePerLiter){const y=new Date(r.datetime||Date.now()).getFullYear();(m[y]=m[y]||[]).push(r.pricePerLiter);}});return Object.entries(m).map(([y,a])=>({label:y,value:a.reduce((s,v)=>s+v,0)/a.length})).sort((a,b)=>a.label-b.label);},[refuels]);
  const spesaMonth=useMemo(()=>{const m={};refuels.filter(byYr).forEach(r=>{if(r.amount){const mo=new Date(r.datetime).getMonth();m[mo]=(m[mo]||0)+r.amount;}});return MONTHS_IT.map((l,i)=>({label:l,value:m[i]||0}));},[refuels,yr]);
  const spesaYear=useMemo(()=>{const m={};refuels.forEach(r=>{if(r.amount){const y=new Date(r.datetime||Date.now()).getFullYear();m[y]=(m[y]||0)+r.amount;}});return Object.entries(m).map(([y,v])=>({label:y,value:v})).sort((a,b)=>a.label-b.label);},[refuels]);
  const consumoMonth=useMemo(()=>{const m={};refuels.filter(byYr).forEach(r=>{if(r.amount&&r.kmDelta&&r.pricePerLiter){const mo=new Date(r.datetime).getMonth();(m[mo]=m[mo]||[]).push(r.amount/r.pricePerLiter/r.kmDelta*100);}});return MONTHS_IT.map((l,i)=>({label:l,value:m[i]?m[i].reduce((s,v)=>s+v,0)/m[i].length:0}));},[refuels,yr]);

  const VIEWS=[{id:"km_year",l:"🛣️ Km/Anno"},{id:"km_month",l:"📅 Km/Mese"},{id:"price_month",l:"💶 Prezzo/Mese"},{id:"price_year",l:"📈 Prezzo/Anno"},{id:"spesa_month",l:"🧾 Spesa/Mese"},{id:"spesa_year",l:"🧾 Spesa/Anno"},{id:"consumo",l:"⚡ Consumo"}];
  const needsYear=["km_month","price_month","spesa_month","consumo"].includes(view);

  if(!refuels.length) return <div style={{textAlign:"center",color:"var(--text-faint)",padding:40}}><div style={{fontSize:48}}>📊</div><div style={{marginTop:12}}>Aggiungi rifornimenti per le statistiche!</div></div>;

  return(<div>
    <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:12}}>
      {VIEWS.map(v=><button key={v.id} onClick={()=>setView(v.id)} style={{background:view===v.id?"var(--violet)":"var(--surface)",color:"#e2e8f0",border:"none",borderRadius:20,padding:"6px 12px",cursor:"pointer",fontSize:12,fontWeight:view===v.id?700:400}}>{v.l}</button>)}
    </div>
    {needsYear&&<div style={{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap"}}>{years.map(y=><button key={y} onClick={()=>setSelY(y)} style={{background:yr===y?"var(--amber)":"var(--surface)",color:yr===y?"#000":"#e2e8f0",border:"none",borderRadius:20,padding:"5px 14px",cursor:"pointer",fontSize:13,fontWeight:700}}>{y}</button>)}</div>}
    {view==="km_year"&&<StatCard title="🛣️ Km/anno" sub="Distanza totale per anno"><BarChart data={kmByYear} color="#3b82f6" fmt={v=>v>0?`${(v/1000).toFixed(1)}k`:"0"}/><StatTable rows={kmByYear.map(d=>({Anno:d.label,"Km":d.value>0?`${d.value.toLocaleString("it-IT")} km`:"N/D"}))}/></StatCard>}
    {view==="km_month"&&<StatCard title={`📅 Km/mese — ${yr}`} sub="Distanza mensile"><BarChart data={kmByMonth} color="#3b82f6" fmt={v=>v>0?`${v}`:"–"}/><StatTable rows={kmByMonth.filter(d=>d.value>0).map(d=>({Mese:d.label,"Km":`${d.value.toLocaleString("it-IT")} km`}))}/></StatCard>}
    {view==="price_month"&&<StatCard title={`💶 Prezzo/mese — ${yr}`} sub="Prezzo medio al litro"><LineChart data={priceMonth} color="var(--amber)"/><StatTable rows={priceMonth.filter(d=>d.value>0).map(d=>({Mese:d.label,"€/L":`€ ${d.value.toFixed(3)}`}))}/></StatCard>}
    {view==="price_year"&&<StatCard title="📈 Prezzo/anno" sub="Prezzo medio al litro per anno"><LineChart data={priceYear} color="var(--amber)"/><StatTable rows={priceYear.map(d=>({Anno:d.label,"€/L":`€ ${d.value.toFixed(3)}`}))}/></StatCard>}
    {view==="spesa_month"&&<StatCard title={`🧾 Spesa/mese — ${yr}`} sub="Importo mensile"><BarChart data={spesaMonth} color="#ec4899" fmt={v=>v>0?`€${v.toFixed(0)}`:"–"}/><StatTable rows={spesaMonth.filter(d=>d.value>0).map(d=>({Mese:d.label,Spesa:`€ ${d.value.toFixed(2)}`}))}/></StatCard>}
    {view==="spesa_year"&&<StatCard title="🧾 Spesa/anno" sub="Spesa totale per anno"><BarChart data={spesaYear} color="#ec4899" fmt={v=>`€${v.toFixed(0)}`}/><StatTable rows={spesaYear.map(d=>({Anno:d.label,Spesa:`€ ${d.value.toFixed(2)}`}))}/></StatCard>}
    {view==="consumo"&&<StatCard title={`⚡ Consumo/mese — ${yr}`} sub="L/100km per mese"><LineChart data={consumoMonth} color="#22d3ee"/><StatTable rows={consumoMonth.filter(d=>d.value>0).map(d=>({Mese:d.label,"L/100km":`${d.value.toFixed(2)} L`}))}/></StatCard>}
  </div>);
}

// ─── HistoryTab ───────────────────────────────────────────────────────────────
const PAGE_SIZE = 50;

function HistoryTab({refuels, onDelete}){
  const years = useMemo(()=>{
    const s=new Set(refuels.map(r=>new Date(r.datetime||Date.now()).getFullYear()));
    return [...s].sort((a,b)=>b-a);
  },[refuels]);

  const [selYear, setSelYear] = useState(null);
  const [page, setPage] = useState(0);

  const activeYear = selYear ?? (years[0] ?? new Date().getFullYear());

  const pickYear = y => { setSelYear(y); setPage(0); };

  const yearRefuels = useMemo(()=>
    [...refuels]
      .filter(r=>new Date(r.datetime||Date.now()).getFullYear()===activeYear)
      .reverse()
  ,[refuels, activeYear]);

  const totalPages = Math.max(1, Math.ceil(yearRefuels.length / PAGE_SIZE));
  const safePage   = Math.min(page, totalPages - 1);
  const pageItems  = yearRefuels.slice(safePage * PAGE_SIZE, (safePage + 1) * PAGE_SIZE);

  const yearSpent = yearRefuels.reduce((s,r)=>s+(r.amount||0),0);
  const yearKm = yearRefuels.reduce((s,r)=>s+(r.kmDelta>0?r.kmDelta:0),0);

  const BtnNav = ({onClick, label, disabled}) => (
    <button onClick={onClick} disabled={disabled} style={{
      background: disabled?"var(--surface)":"var(--border)", color: disabled?"#475569":"#e2e8f0",
      border:"none", borderRadius:8, padding:"8px 14px", cursor: disabled?"default":"pointer",
      fontSize:16, fontWeight:700, minWidth:42, lineHeight:1
    }}>{label}</button>
  );

  if(!refuels.length) return <div style={{color:"var(--text-faint)",fontSize:13}}>Nessun rifornimento.</div>;

  return(<div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
      <div style={{fontWeight:700,fontSize:16}}>📋 Storico <span style={{color:"var(--text-faint)",fontSize:13,fontWeight:400}}>({refuels.length} tot.)</span></div>
    </div>

    {/* Selezione anno */}
    <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:12}}>
      {years.map(y=>(
        <button key={y} onClick={()=>pickYear(y)} style={{
          background: y===activeYear?"var(--amber)":"var(--surface)",
          color: y===activeYear?"#000":"#e2e8f0",
          border:"none", borderRadius:20, padding:"6px 16px",
          cursor:"pointer", fontSize:13, fontWeight:700
        }}>{y}</button>
      ))}
    </div>

    {/* Riepilogo anno */}
    <div style={{background:"var(--surface)",borderRadius:12,padding:"10px 14px",marginBottom:14,display:"flex",gap:20,flexWrap:"wrap"}}>
      <div style={{fontSize:13}}><span style={{color:"var(--text-faint)"}}>Rifornimenti: </span><strong>{yearRefuels.length}</strong></div>
      <div style={{fontSize:13}}><span style={{color:"var(--text-faint)"}}>Spesa: </span><strong style={{color:"var(--amber)"}}>€ {yearSpent.toFixed(2)}</strong></div>
      {yearKm>0&&<div style={{fontSize:13}}><span style={{color:"var(--text-faint)"}}>Km: </span><strong>{yearKm.toLocaleString("it-IT")} km</strong></div>}
    </div>

    {pageItems.length===0&&<div style={{color:"var(--text-faint)",fontSize:13}}>Nessun rifornimento nel {activeYear}.</div>}

    {pageItems.map(r=>(
      <div key={r.id} className="card-hover fade-in" style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:"var(--radius-md)",padding:14,marginBottom:10}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
          <div>
            <div style={{fontWeight:700,fontSize:15}}>{fmtDate(r.datetime)} {fmtTime(r.datetime)}</div>
            <div style={{fontSize:12,color:"var(--text-dim)",marginTop:2}}>{r.fuelType}{r.vehicle?` · ${r.vehicle}`:""}</div>
          </div>
          <button onClick={()=>onDelete(r.id)} style={{background:"transparent",border:"none",color:"#ef4444",cursor:"pointer",fontSize:18,padding:0}}>🗑️</button>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginTop:10}}>
          {[
            {l:"Km attuali", v:r.km?`${r.km.toLocaleString("it-IT")} km`:"-"},
            {l:"Percorsi",   v:r.kmDelta>0?`+${r.kmDelta} km`:"-"},
            {l:"Importo",    v:`€ ${(r.amount||0).toFixed(2)}`},
          ].map((x,i)=>(
            <div key={i} style={{background:"var(--surface-2)",borderRadius:8,padding:8,textAlign:"center"}}>
              <div style={{fontSize:13,fontWeight:700,color:"var(--amber)"}}>{x.v}</div>
              <div style={{fontSize:10,color:"var(--text-faint)",marginTop:2}}>{x.l}</div>
            </div>
          ))}
        </div>
        <div style={{marginTop:8,fontSize:12,color:"var(--text-dim)"}}>€ {(r.pricePerLiter||0).toFixed(3)}/litro</div>
      </div>
    ))}

    {/* Paginazione */}
    {totalPages > 1 && (
      <div style={{background:"var(--surface)",borderRadius:12,padding:"12px 14px",marginTop:4,display:"flex",alignItems:"center",justifyContent:"space-between",gap:6}}>
        <div style={{display:"flex",gap:6}}>
          <BtnNav onClick={()=>setPage(0)}              label="⏮" disabled={safePage===0}/>
          <BtnNav onClick={()=>setPage(p=>p-1)}         label="‹"  disabled={safePage===0}/>
        </div>
        <div style={{textAlign:"center"}}>
          <div style={{fontSize:13,color:"#e2e8f0"}}>Pag. <strong>{safePage+1}</strong> / {totalPages}</div>
          <div style={{fontSize:11,color:"var(--text-faint)",marginTop:2}}>
            {safePage*PAGE_SIZE+1}–{Math.min((safePage+1)*PAGE_SIZE, yearRefuels.length)} di {yearRefuels.length}
          </div>
        </div>
        <div style={{display:"flex",gap:6}}>
          <BtnNav onClick={()=>setPage(p=>p+1)}         label="›"  disabled={safePage===totalPages-1}/>
          <BtnNav onClick={()=>setPage(totalPages-1)}   label="⏭" disabled={safePage===totalPages-1}/>
        </div>
      </div>
    )}
  </div>);
}

// ─── ResetConfirmModal ────────────────────────────────────────────────────────
function ResetConfirmModal({count,onConfirm,onClose}){
  const [busy,setBusy]=useState(false);
  const go=async()=>{setBusy(true);await onConfirm();setBusy(false);};
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",zIndex:300,display:"flex",alignItems:"center",justifyContent:"center",padding:24}}>
      <div style={{background:"var(--surface)",borderRadius:20,padding:28,maxWidth:360,width:"100%",border:"2px solid #dc2626"}}>
        <div style={{fontSize:40,textAlign:"center",marginBottom:12}}>⚠️</div>
        <div style={{fontWeight:700,fontSize:18,textAlign:"center",marginBottom:8,color:"#fca5a5"}}>Sei sicuro?</div>
        <div style={{fontSize:14,color:"var(--text-dim)",textAlign:"center",marginBottom:24}}>
          Stai per eliminare <strong style={{color:"#fff"}}>{count} rifornimenti</strong> da Firebase.<br/>
          Questa operazione è <strong style={{color:"#fca5a5"}}>irreversibile</strong>.
        </div>
        <div style={{display:"flex",gap:10}}>
          <button onClick={onClose} style={{flex:1,background:"var(--border)",color:"#e2e8f0",border:"none",borderRadius:10,padding:"13px 0",cursor:"pointer",fontSize:15,fontWeight:600}}>Annulla</button>
          <button onClick={go} disabled={busy} style={{flex:1,background:busy?"#7f1d1d":"#dc2626",color:"#fff",border:"none",borderRadius:10,padding:"13px 0",cursor:busy?"not-allowed":"pointer",fontSize:15,fontWeight:700}}>
            {busy?"⏳ Eliminazione...":"Sì, elimina tutto"}
          </button>
        </div>
      </div>
    </div>
  );
}

alt="" style={{width:36,height:36,borderRadius:10,boxShadow:"0 4px 10px rgba(0,0,0,.25)",flexShrink:0}}/>
          <div style={{minWidth:0}}>
            <div style={{fontSize:18,fontWeight:800,letterSpacing:"-.2px"}}>BenzinApp</div>
            <div style={{fontSize:11,fontWeight:600,marginTop:3,display:"inline-block",background:"rgba(255,255,255,.16)",borderRadius:999,padding:"3px 9px",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",maxWidth:"100%"}}>
              {activeVehicle?`🚘 ${activeVehicle.brand} ${activeVehicle.model}${activeVehicle.targa?` · ${activeVehicle.targa}`:""}` : "Nessun veicolo attivo"}
            </div>
          </div>
        </div>
        <button onClick={()=>setShowAdd(true)} style={{background:"var(--amber)",color:"#1a1206",border:"none",borderRadius:999,padding:"11px 16px",fontWeight:800,cursor:"pointer",fontSize:13,boxShadow:"0 6px 16px -4px rgba(245,166,35,.55)",whiteSpace:"nowrap",flexShrink:0}}>+ Rifornimento</button>
      </div>
      <div style={{display:"flex",gap:4,overflowX:"auto",paddingBottom:10,scrollbarWidth:"none"}}>
        {TABS.map(t=><button key={t.id} onClick={()=>setTab(t.id)} style={{flex:"0 0 auto",background:tab===t.id?"rgba(255,255,255,.18)":"transparent",color:tab===t.id?"#fff":"rgba(255,255,255,.68)",border:"none",borderRadius:999,padding:"7px 13px",cursor:"pointer",fontSize:11,fontWeight:tab===t.id?700:500,whiteSpace:"nowrap"}}>{t.e} {t.t}</button>)}
      </div>
    </div>

    {notif&&<div style={{position:"fixed",top:16,left:"50%",transform:"translateX(-50%)",background:notif.type==="error"?"#dc2626":"#16a34a",color:"#fff",borderRadius:10,padding:"10px 20px",zIndex:999,fontSize:14,fontWeight:600,boxShadow:"0 4px 20px rgba(0,0,0,0.4)",whiteSpace:"nowrap"}}>{notif.msg}</div>}

    <div style={{padding:16}}>

      {/* ── DASHBOARD ── */}
      {tab==="dashboard"&&<>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:16}}>
          {[{l:"Totale speso",v:`€ ${tot.toFixed(2)}`,i:"💶",c:"#3b6ef0"},{l:"Km percorsi",v:`${(totKm||0).toFixed(0)} km`,i:"🛣️",c:"#22d3ee"},{l:"Prezzo medio",v:`€ ${avgP.toFixed(3)}/L`,i:"📈",c:"#f5a623"},{l:"Consumo medio",v:avgC>0?`${avgC.toFixed(1)} L/100km`:"N/D",i:"⚡",c:"#34d399"}].map((s,i)=>(
            <div key={i} className="card-hover fade-in" style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:"var(--radius-lg)",padding:16,boxShadow:"var(--shadow-card)"}}>
              <div style={{width:38,height:38,borderRadius:12,background:s.c+"29",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>{s.i}</div>
              <div style={{fontSize:19,fontWeight:800,marginTop:10,letterSpacing:"-.2px"}}>{s.v}</div>
              <div style={{fontSize:11,color:"var(--text-dim)",marginTop:2}}>{s.l}</div>
            </div>
          ))}
        </div>
        <div style={{background:"var(--surface)",borderRadius:14,padding:16,marginBottom:16}}>
          <div style={{fontWeight:700,marginBottom:10,fontSize:14}}>📅 Ultimi rifornimenti</div>
          {!refuels.length&&<div style={{color:"var(--text-faint)",fontSize:13}}>Nessun rifornimento. Aggiungine uno!</div>}
          {[...refuels].slice(-5).reverse().map(r=>(
            <div key={r.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:"1px solid var(--border)"}}>
              <div>
                <div style={{fontSize:13,fontWeight:600}}>{fmtDate(r.datetime)} · {r.fuelType}</div>
                <div style={{fontSize:11,color:"var(--text-dim)"}}>{r.kmDelta>0?`+${r.kmDelta} km`:""} {r.vehicle?`· ${r.vehicle}`:""}</div>
              </div>
              <div style={{textAlign:"right"}}>
                <div style={{color:"var(--amber)",fontWeight:700}}>€ {(r.amount||0).toFixed(2)}</div>
                <div style={{fontSize:11,color:"var(--text-dim)"}}>€ {(r.pricePerLiter||0).toFixed(3)}/L</div>
              </div>
            </div>
          ))}
        </div>
        <div style={{marginTop:4,fontSize:11,color:"#475569",textAlign:"center"}}>☁️ Sincronizzato su Firebase</div>
      </>}

      {/* ── STATISTICHE ── */}
      {tab==="stats"&&<StatsTab refuels={refuels}/>}

      {/* ── STORICO ── */}
      {tab==="history"&&<HistoryTab refuels={refuels} onDelete={handleDelete}/>}

      {/* ── GARAGE ── */}
      {tab==="garage"&&<>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
          <div style={{fontWeight:700,fontSize:16}}>🚗 Il mio Garage ({garage.length})</div>
          <button onClick={()=>setShowAddVehicle(true)} style={{background:"var(--grad)",color:"#fff",border:"none",borderRadius:10,padding:"8px 14px",cursor:"pointer",fontSize:13,fontWeight:700}}>+ Aggiungi</button>
        </div>
        {!garage.length&&(
          <div style={{background:"var(--surface)",borderRadius:14,padding:32,textAlign:"center",color:"var(--text-faint)"}}>
            <div style={{fontSize:48,marginBottom:12}}>🅿️</div>
            <div style={{fontSize:14}}>Garage vuoto.<br/>Aggiungi il tuo primo veicolo!</div>
          </div>
        )}
        {garage.map(v=>{
          const isActive=v.id===activeId;
          const vRefuels=refuels.filter(r=>r.vehicle&&r.vehicle.toLowerCase().includes(v.model.toLowerCase()));
          return(
            <div key={v.id} className="card-hover fade-in" style={{background:"var(--surface)",borderRadius:"var(--radius-lg)",padding:16,marginBottom:12,border:isActive?"2px solid var(--amber)":"1px solid var(--border)",boxShadow:isActive?"0 0 0 3px rgba(245,166,35,.14)":"none"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                <div style={{display:"flex",gap:12,alignItems:"center"}}>
                  <div style={{fontSize:34}}>🚘</div>
                  <div>
                    <div style={{fontWeight:700,fontSize:17}}>{v.brand} {v.model}</div>
                    <div style={{fontSize:12,color:"var(--text-dim)",marginTop:2}}>{v.year?`${v.year} · `:""}{v.fuel}{v.targa?` · ${v.targa}`:""}</div>
                    <div style={{fontSize:12,color:"var(--text-faint)",marginTop:2}}>⛽ {vRefuels.length} rifornimenti</div>
                  </div>
                </div>
                {isActive&&<div style={{background:"var(--amber)",color:"#000",borderRadius:6,padding:"3px 8px",fontSize:11,fontWeight:700,whiteSpace:"nowrap"}}>✓ ATTIVO</div>}
              </div>
              <div style={{display:"flex",gap:8,marginTop:12}}>
                {!isActive?(
                  <button onClick={()=>handleSetActive(v.id)} style={{flex:1,background:"var(--amber)",color:"#000",border:"none",borderRadius:8,padding:"9px 0",cursor:"pointer",fontSize:13,fontWeight:700}}>⭐ Imposta attivo</button>
                ):(
                  <div style={{flex:1,background:"#422006",color:"#fbbf24",borderRadius:8,padding:"9px 0",fontSize:13,fontWeight:600,textAlign:"center"}}>✓ In uso ora</div>
                )}
                <button onClick={()=>handleRemoveVehicle(v.id)} style={{background:"#1f2937",color:"#ef4444",border:"1px solid #374151",borderRadius:8,padding:"9px 14px",cursor:"pointer",fontSize:14}}>🗑️</button>
              </div>
            </div>
          );
        })}
      </>}

      {/* ── IMPOSTAZIONI ── */}
      {tab==="settings"&&<>
        <div style={{fontWeight:700,fontSize:16,marginBottom:16}}>⚙️ Impostazioni</div>

        {/* Dati & Backup */}
        <div style={{background:"var(--surface)",borderRadius:14,padding:18,marginBottom:12}}>
          <div style={{fontWeight:700,fontSize:14,marginBottom:4}}>📦 Dati & Backup</div>
          <div style={{fontSize:13,color:"var(--text-faint)",marginBottom:14}}>
            {refuels.length} rifornimenti · {garage.length} veicoli in garage<br/>
            <span style={{fontSize:11,color:"#475569"}}>☁️ Tutti i dati su Firebase (sincronizzati)</span>
          </div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={()=>setShowImport(true)} style={{flex:1,background:"var(--border)",color:"#e2e8f0",border:"none",borderRadius:8,padding:11,cursor:"pointer",fontSize:13,fontWeight:600}}>📥 Importa CSV</button>
            <button onClick={()=>setShowExport(true)} style={{flex:1,background:"var(--border)",color:"#e2e8f0",border:"none",borderRadius:8,padding:11,cursor:"pointer",fontSize:13,fontWeight:600}}>📤 Esporta CSV</button>
          </div>
        </div>

        {/* Zona pericolosa */}
        <div style={{background:"var(--surface)",borderRadius:14,padding:18,border:"1px solid #7f1d1d"}}>
          <div style={{fontWeight:700,fontSize:14,color:"#fca5a5",marginBottom:6}}>⚠️ Zona pericolosa</div>
          <div style={{fontSize:13,color:"var(--text-dim)",marginBottom:14}}>
            Elimina tutti i <strong style={{color:"#fff"}}>rifornimenti</strong> da Firebase. Il garage e i veicoli non vengono toccati. Operazione irreversibile.
          </div>
          <button onClick={()=>setShowReset(true)} style={{width:"100%",background:"#7f1d1d",color:"#fca5a5",border:"1px solid #dc2626",borderRadius:10,padding:"12px 16px",cursor:"pointer",fontSize:14,fontWeight:700}}>
            🗑️ Reset dati rifornimenti
          </button>
        </div>
      </>}
    </div>

    {showAdd&&<AddRefuelModal vehicle={activeVehicle} lastKm={lastKm} onSave={async r=>{await handleSave(r);setShowAdd(false);}} onClose={()=>setShowAdd(false)}/>}
    {showAddVehicle&&<AddVehicleModal onSave={handleAddVehicle} onClose={()=>setShowAddVehicle(false)}/>}
    {showImport&&<ImportModal onImport={handleImport} onClose={()=>setShowImport(false)} activeVehicle={activeVehicle} notify={notify}/>}
    {showExport&&<ExportModal refuels={refuels} onClose={()=>setShowExport(false)}/>}
    {showReset&&<ResetConfirmModal count={refuels.length} onConfirm={handleReset} onClose={()=>setShowReset(false)}/>}
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
